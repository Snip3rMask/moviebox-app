name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.1). Tag: release-<version>'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version }}"
            TAG="release-$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "release.keystore written"
          else
            echo "No KEYSTORE_BASE64 secret -> falling back to debug keystore"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=$(( $GITHUB_RUN_NUMBER ))
          ls -la app/build/outputs/apk/release/

      - name: Create GitHub Release (APK attached directly)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pi-Stream ${{ steps.version.outputs.version }}
          body: |
            Auto-built from the **Pi-Stream** repository.

            - Version: `${{ steps.version.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - Built by GitHub Actions (${{ github.run_id }})

            ## Install
            Download the `app-release.apk` below and install it on your Android device (allow "unknown sources").

            ## Changelog
            ${{ github.event.head_commit.message }}
          files: |
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true

  build-desktop:
    name: Build Windows desktop app (mpv player)
    runs-on: windows-latest
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version }}"
            TAG="release-$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download mpv (Windows build)
        shell: pwsh
        run: |
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-x86_64-20260610-git-304426c.7z"
          Invoke-WebRequest -Uri $mpvUrl -OutFile mpv.7z
          New-Item -ItemType Directory -Force -Path desktopApp/src/main/resources/mpv | Out-Null
          $extract = Join-Path $env:TEMP "mpv_extract"
          & "C:\Program Files\7-Zip\7z.exe" x mpv.7z -o"$extract" -y | Out-Null
          Get-ChildItem -Path $extract -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName -Destination "desktopApp/src/main/resources/mpv/" -Force
          }
          Get-ChildItem "desktopApp/src/main/resources/mpv/" | Select-Object -First 6 Name

      - name: Build Windows installer (EXE)
        shell: bash
        run: |
          ./gradlew :desktopApp:packageExe --stacktrace --configure-on-demand \
            -PversionName=${{ steps.version.outputs.version }}
          ls -la desktopApp/build/compose/binaries/main/exe/

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" desktopApp/build/compose/binaries/main/exe/*.exe --repo "${{ github.repository }}" --clobber
          echo "Uploaded desktop installer to release $TAG"
